<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e2553f">
<title>✈️ 56일 여행 일본어 — 기초 정석 & 여행 실전</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2ec;--card:#ffffff;--card2:#faf7f2;--text:#22252b;--sub:#6b7079;--line:#e6e0d6;--accent:#e2553f;--accent-s:#fde7e2;--ok:#1f9d55;--ok-s:#e3f6ea;--bad:#d64545;--bad-s:#fde6e6;
 --ink:#1d1d1f;--grid:#eab4a8;--guide:rgba(40,40,40,.17);--mask:#d8d1c5;--shadow:0 2px 10px rgba(60,40,20,.07);
 --r-s:#2f6fdf;--r-p:#e08a00;--r-o:#1f9d55;--r-v:#d64545;--r-n:#7c4dcc;--r-m:#0f9aa8;--r-l:#a0702b;--r-w:#4b5563;--r-e:#c2417a;}
[data-theme=dark]{--bg:#111318;--card:#1b1e25;--card2:#22262e;--text:#e9e7e3;--sub:#9aa1ab;--line:#2e333c;--accent:#ff7a63;--accent-s:#3a2320;--ok:#3fcf7f;--ok-s:#173226;--bad:#ff6b6b;--bad-s:#3a1d1f;
 --ink:#f3f3f3;--grid:#6a3f37;--guide:rgba(255,255,255,.17);--mask:#3a3f4a;--shadow:0 2px 10px rgba(0,0,0,.35);
 --r-s:#6b9cff;--r-p:#ffb340;--r-o:#45d08a;--r-v:#ff7474;--r-n:#b08cff;--r-m:#3fd0de;--r-l:#e0a95c;--r-w:#aab3c0;--r-e:#ff79b0;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Hiragino Sans',sans-serif;line-height:1.55;}
body{padding-bottom:env(safe-area-inset-bottom);transition:background .2s}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.jp{font-family:'Klee One','Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif;font-weight:600}
/* ---------- 헤더 ---------- */
header{position:sticky;top:0;z-index:50;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:8px 12px calc(6px);padding-top:max(8px,env(safe-area-inset-top))}
.hwrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-weight:900;font-size:1.05rem;margin-right:auto;white-space:nowrap}
.brand small{font-weight:500;color:var(--sub);font-size:.72rem;margin-left:4px}
.dday{background:var(--accent);color:#fff;font-weight:900;padding:4px 11px;border-radius:999px;font-size:.92rem;letter-spacing:.3px}
.ib{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:1.05rem;display:grid;place-items:center}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:6px 11px;border-radius:9px;font-weight:700;font-size:.88rem;color:var(--sub);white-space:nowrap}
.seg button.on{background:var(--accent);color:#fff;box-shadow:var(--shadow)}
.pill{padding:6px 11px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:.85rem;font-weight:700;white-space:nowrap}
.pill.on{background:var(--accent-s);border-color:var(--accent);color:var(--accent)}
.timer{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px 4px 3px 10px;font-weight:800;font-variant-numeric:tabular-nums}
.timer.run{border-color:var(--ok);color:var(--ok)}
.timer button{width:30px;height:28px;border-radius:7px;background:var(--card2)}
.penonly{font-size:.8rem;color:var(--sub);display:flex;align-items:center;gap:4px}
.prog{display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--sub)}
.bar{flex:1;height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9a7a,var(--accent));border-radius:99px;transition:width .6s}
/* ---------- 레이아웃 ---------- */
.wrap{max-width:900px;margin:0 auto;padding:12px}
#nav{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.weeks{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.wk{padding:6px 0;border-radius:10px;background:var(--card2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;line-height:1.2}
.wk b{font-size:.88rem}.wk small{font-size:.68rem;color:var(--sub)}
.wk.on{background:var(--accent);border-color:var(--accent);color:#fff}.wk.on small{color:#fff}
.wtitle{display:flex;align-items:center;gap:8px;margin:10px 2px 8px;font-size:.92rem}
.wtitle span{margin-right:auto}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dy{position:relative;padding:8px 0 6px;border-radius:12px;background:var(--card2);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;line-height:1.15}
.dy b{font-size:.8rem}.dy small{font-size:.66rem;color:var(--sub)}
.dy.on{border-color:var(--accent);background:var(--accent-s)}
.dy.done{background:var(--ok-s)}
.dy .st{position:absolute;top:-7px;right:-4px;font-style:normal;font-size:1rem}
.dy em{position:absolute;bottom:-8px;font-style:normal;font-size:.6rem;background:var(--accent);color:#fff;padding:0 5px;border-radius:6px}
.dayhead{margin:18px 4px 6px}
.dh-meta{font-size:.82rem;color:var(--sub);font-weight:700}
.dayhead h2{margin:4px 0 0;font-size:1.32rem;line-height:1.35}
.badge{display:inline-block;font-size:.74rem;padding:2px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--sub);font-weight:700}
.badge.today{background:var(--accent);color:#fff;border-color:var(--accent)}
.badge.ok{background:var(--ok-s);color:var(--ok);border-color:var(--ok)}
.step{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:14px;box-shadow:var(--shadow)}
.step-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.step-h h3{margin:0;font-size:1.02rem;margin-right:auto}
.sn{background:var(--text);color:var(--bg);font-size:.68rem;font-weight:900;padding:3px 8px;border-radius:7px;letter-spacing:.5px}
.tm{font-size:.78rem;color:var(--sub);font-weight:700}
/* Step1 */
.note p{margin:0 0 10px}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--card2);font-size:.8rem;color:var(--sub);white-space:nowrap}
tr:last-child td{border-bottom:none}
td:first-child{font-weight:700;font-size:1.02rem;white-space:nowrap}
.tip{margin-top:10px;background:var(--accent-s);border-left:4px solid var(--accent);padding:9px 12px;border-radius:10px;font-size:.9rem}
/* Step2 카드 */
.legend{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px;align-items:center}
.lg{font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:6px;border:1.5px solid;color:var(--c)}
.mc{margin-left:auto;font-size:.8rem;font-weight:800;color:var(--ok)}
.hint-line{font-size:.82rem;color:var(--sub);margin:4px 0 8px}
.card{border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-top:12px;background:var(--card2)}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.num{width:24px;height:24px;border-radius:50%;background:var(--text);color:var(--bg);font-size:.75rem;font-weight:900;display:grid;place-items:center}
.ibtn{width:38px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:1.05rem}
.memchk{margin-left:auto;font-size:.82rem;font-weight:700;display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);padding:5px 10px;border-radius:10px;cursor:pointer}
.memchk input{width:18px;height:18px;accent-color:var(--ok)}
.blocks{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.plus{color:var(--sub);font-size:.8rem;opacity:.6}
.blk{--c:var(--r-w);display:flex;flex-direction:column;align-items:center;padding:4px 10px 6px;border-radius:12px;background:var(--card);border:2px solid var(--c);min-width:44px;transition:transform .1s}
.blk:active{transform:scale(.95)}
.blk .role{font-size:.62rem;font-weight:800;color:var(--c);letter-spacing:.3px}
.blk .jp{font-size:1.45rem;line-height:1.25}
.r-s{--c:var(--r-s)}.r-p{--c:var(--r-p)}.r-o{--c:var(--r-o)}.r-v{--c:var(--r-v)}.r-n{--c:var(--r-n)}.r-m{--c:var(--r-m)}.r-l{--c:var(--r-l)}.r-w{--c:var(--r-w)}.r-e{--c:var(--r-e)}
.lg.r-s,.lg.r-p,.lg.r-o,.lg.r-v,.lg.r-n,.lg.r-m,.lg.r-l{border-color:var(--c)}
.mrow{display:flex;align-items:center;gap:8px;margin-top:7px}
.ml{font-size:.72rem;font-weight:800;color:var(--sub);width:30px;flex:none}
.mask{position:relative;padding:3px 10px;border-radius:8px;cursor:pointer;user-select:none;transition:all .2s;font-weight:600}
.mask.covered{color:transparent;background:repeating-linear-gradient(45deg,var(--mask),var(--mask) 6px,color-mix(in srgb,var(--mask) 80%,var(--card)) 6px,color-mix(in srgb,var(--mask) 80%,var(--card)) 12px);min-width:120px}
.mask.covered::after{content:'👆 터치해서 확인';position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);font-size:.72rem;font-weight:700}
/* 연습 영역 */
.practice{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.prac-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.prac-title{font-size:.85rem;font-weight:800;margin-right:auto}
.chips{display:flex;gap:4px}
.chip{font-size:.75rem;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:700}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.subtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--card);border:1px solid var(--line);padding:3px;border-radius:12px;margin-bottom:10px}
.stab{padding:7px 2px;border-radius:9px;font-size:.82rem;font-weight:700;color:var(--sub)}
.stab.on{background:var(--accent-s);color:var(--accent)}
.row-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center}
.sbtn{padding:8px 13px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:.85rem;font-weight:700}
.sbtn:disabled{opacity:.4}
.sbtn.good{background:var(--ok);border-color:var(--ok);color:#fff}
.sbtn.danger{color:var(--bad);border-color:var(--bad)}
.bigbtn{padding:12px 22px;border-radius:14px;background:var(--accent);color:#fff;font-weight:900;font-size:1rem;box-shadow:var(--shadow)}
/* 타일 */
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
.slot{width:48px;height:54px;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;font-size:1.6rem;font-family:'Klee One','Hiragino Sans',sans-serif;font-weight:600;background:var(--card)}
.slot.fill{border-style:solid;border-color:var(--r-s);cursor:pointer}
.slots.ok .slot{border-color:var(--ok);background:var(--ok-s)}
.slots.bad{animation:shake .35s}.slots.bad .slot{border-color:var(--bad);background:var(--bad-s)}
.pool{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.tile{width:52px;height:52px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line);font-size:1.55rem;transition:transform .1s}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tile:disabled{opacity:.18;box-shadow:none}
/* 플래시카드 */
.flashwrap{perspective:1000px}
.flash{position:relative;height:170px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.flash.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;text-align:center;border:1.5px solid var(--line)}
.front{background:var(--card)}.front .big{font-size:2.3rem;line-height:1.2;word-break:keep-all}.front small{color:var(--sub);margin-top:6px}
.back{background:var(--accent-s);transform:rotateY(180deg)}
.fb-read{font-size:1.2rem;font-weight:800;color:var(--accent)}.fb-mean{font-size:1.05rem;font-weight:700;margin-top:4px}.fb-jp{color:var(--sub);margin-top:6px}
/* 타이핑 */
.ty-q{font-size:.95rem;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ty-in{width:100%;padding:12px 14px;font-size:1.3rem;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--text);outline:none}
.ty-in:focus{border-color:var(--r-s)}
.ty-prev{font-size:.85rem;color:var(--sub);margin-top:5px;min-height:1.4em}.ty-prev span{font-size:1.1rem;color:var(--text)}
.ty-res{margin-top:8px;text-align:center;font-weight:800;min-height:1.4em}.ty-res.ok{color:var(--ok)}.ty-res.bad{color:var(--bad)}.ty-res .jp{font-size:1.2rem}
.ty-help{font-size:.74rem;color:var(--sub);margin-top:8px;background:var(--card);padding:8px 10px;border-radius:10px;border:1px solid var(--line)}
/* 손글씨 패드 */
.pad-label{font-size:.82rem;font-weight:800;margin:10px 0 6px;color:var(--accent)}
.pad-tools{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.tb{padding:6px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:.8rem;font-weight:700}
.tb.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.stage{position:relative;width:100%;background:var(--card);border-radius:12px;border:1px solid var(--line);overflow:hidden;min-height:60px}
.stage canvas{position:absolute;left:0;top:0;display:block}
.stage .ink{touch-action:none;-ms-touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:crosshair}
/* 퀴즈 */
.q-head{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--sub);font-weight:700}
.q-dots{display:flex;gap:5px}.q-dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.q-dots i.cur{outline:2px solid var(--accent);outline-offset:1px}.q-dots i.ok{background:var(--ok)}
.q-prompt{font-size:1.15rem;font-weight:800;margin:10px 0;padding:12px;background:var(--card2);border-radius:12px;border:1px solid var(--line)}
.q-ans{min-height:64px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.q-ans.ok{border-style:solid;border-color:var(--ok);background:var(--ok-s)}
.q-ans.bad{border-color:var(--bad);background:var(--bad-s);animation:shake .35s}
.q-ans .ph{color:var(--sub);font-size:.82rem;width:100%;text-align:center}
.q-pool{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.qb{padding:9px 13px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line);font-size:1.25rem}
.q-ans .qb{border-color:var(--r-s)}
.qb.used{opacity:.15;pointer-events:none;box-shadow:none}
.q-fb{text-align:center;font-weight:800;margin-top:10px;min-height:1.3em}.q-fb.ok{color:var(--ok)}.q-fb.bad{color:var(--bad)}.q-fb .jp{font-size:1.15rem}.q-fb small{color:var(--sub);font-weight:600}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pager{display:flex;justify-content:space-between;margin:16px 0 30px}
/* 도장 오버레이 */
#stampOv{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
#stampOv.show{display:flex}
.stamp-box{background:var(--card);border-radius:22px;padding:22px;text-align:center;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.stamp-box h3{margin:12px 0 4px}.stamp-box p{color:var(--sub);margin:0;font-size:.88rem}
.stamp{width:140px;height:140px;margin:0 auto;border-radius:50%;border:6px solid #d93a2b;color:#d93a2b;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-14deg);animation:stampIn .5s cubic-bezier(.2,1.6,.4,1);font-family:'Klee One',serif;box-shadow:inset 0 0 0 3px rgba(217,58,43,.25)}
.stamp span{font-size:2.6rem;font-weight:600;line-height:1}.stamp small{font-weight:900;letter-spacing:2px;font-family:'Noto Sans KR'}
@keyframes stampIn{0%{transform:scale(2.6) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(-14deg);opacity:1}}
.cal{max-width:560px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:12px 0}
.cc{aspect-ratio:1;border-radius:10px;background:var(--card2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;line-height:1.1}
.cc small{font-size:.58rem;color:var(--sub);font-weight:600}.cc.done{background:var(--ok-s);border-color:var(--ok)}.cc.today{outline:2px solid var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:.88rem;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:200;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:var(--sub);font-size:.74rem;padding:0 12px 30px}

/* ---------- 50음도 표 ---------- */
.kbtn{width:auto;padding:0 9px;font-family:'Klee One','Hiragino Sans',sans-serif;font-weight:600;font-size:.95rem}
#kanaOv{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:12px;overflow-y:auto;-webkit-overflow-scrolling:touch}
#kanaOv.show{display:flex}
.kana-box{background:var(--card);border-radius:22px;padding:14px;max-width:900px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3);margin:auto 0}
.kana-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.kana-head h3{margin:0;margin-right:auto;font-size:1.05rem}
.ktabs{display:flex;gap:4px;background:var(--card2);border:1px solid var(--line);padding:3px;border-radius:12px;margin-bottom:10px;overflow-x:auto}
.ktab{flex:1;padding:7px 8px;border-radius:9px;font-size:.84rem;font-weight:700;color:var(--sub);white-space:nowrap}
.ktab.on{background:var(--accent);color:#fff}
.kopts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:.8rem;color:var(--sub)}
.kgrid-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kgrid-wrap.single{grid-template-columns:1fr}
.kpanel{border:2px solid var(--text);border-radius:4px;overflow:hidden;background:var(--card)}
.ktitle{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 6px 6px;border-bottom:2px solid var(--text);background:var(--card)}
.ktitle .emo{font-size:1.7rem;line-height:1}
.ktitle .tt{text-align:center;line-height:1.1}
.ktitle .tt b{display:block;font-family:'Klee One','Hiragino Sans',sans-serif;font-size:1.65rem;font-weight:600;letter-spacing:1px}
.ktitle .tt small{font-size:.78rem;font-weight:700;color:var(--sub)}
.kgrid{display:grid;grid-template-columns:repeat(5,1fr)}
.kgrid.c3{grid-template-columns:repeat(3,1fr)}

const R2K=(()=>{const m={},V='aiueo';
  const rows={'':'あいうえお',k:'かきくけこ',s:'さしすせそ',t:'たちつてと',n:'なにぬねの',h:'はひふへほ',m:'まみむめも',y:'や_ゆ_よ',r:'らりるれろ',w:'わ___を',g:'がぎぐげご',z:'ざじずぜぞ',d:'だぢづでど',b:'ばびぶべぼ',p:'ぱぴぷぺぽ'};
  for(const c in rows)[...rows[c]].forEach((k,i)=>{if(k!=='_')m[c+V[i]]=k;});
  Object.assign(m,{shi:'し',chi:'ち',tsu:'つ',fu:'ふ',ji:'じ',si:'し',ti:'ち',tu:'つ',hu:'ふ',zi:'じ',wo:'を',
    xa:'ぁ',xi:'ぃ',xu:'ぅ',xe:'ぇ',xo:'ぉ',la:'ぁ',li:'ぃ',lu:'ぅ',le:'ぇ',lo:'ぉ',xtu:'っ',ltu:'っ',xtsu:'っ',ltsu:'っ',
    xya:'ゃ',xyu:'ゅ',xyo:'ょ',lya:'ゃ',lyu:'ゅ',lyo:'ょ','-':'ー',
    she:'しぇ',che:'ちぇ',je:'じぇ',thi:'てぃ',dhi:'でぃ',fa:'ふぁ',fi:'ふぃ',fe:'ふぇ',fo:'ふぉ',wi:'うぃ',we:'うぇ',vu:'ゔ',va:'ゔぁ',vi:'ゔぃ',ve:'ゔぇ',vo:'ゔぉ'});
  const Y={ky:'き',sh:'し',ch:'ち',ny:'に',hy:'ひ',my:'み',ry:'り',gy:'ぎ',j:'じ',jy:'じ',zy:'じ',by:'び',py:'ぴ',dy:'ぢ',cy:'ち',sy:'し',ty:'ち'};
  const sm={a:'ゃ',u:'ゅ',o:'ょ'};for(const p in Y)for(const v in sm)m[p+v]=Y[p]+sm[v];
  return m;})();
function romaToKana(s){
  s=s.toLowerCase();let out='',i=0;
  while(i<s.length){const c=s[i];
    if(!/[a-z'\-]/.test(c)){out+=c;i++;continue;}
    if(c==='n'){const n1=s[i+1],n2=s[i+2];
      if(n1==="'"){out+='ん';i+=2;continue;}
      if(n1==='n'){if(n2&&/[aiueoy]/.test(n2)){out+='ん';i+=1;}else{out+='ん';i+=2;}continue;}
      if(n1===undefined||!/[aiueoy]/.test(n1)){out+='ん';i++;continue;}}
    if(c===s[i+1]&&/[bcdfghjkmpqrstvwxyz]/.test(c)){out+='っ';i++;continue;}
    if(c==='t'&&s[i+1]==='c'&&s[i+2]==='h'){out+='っ';i++;continue;}
    let hit=false;for(let L=4;L>=1;L--){const sub=s.substr(i,L);if(R2K[sub]){out+=R2K[sub];i+=L;hit=true;break;}}
    if(!hit){out+=c;i++;}
  }return out;}
const kataToHira=s=>s.replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const norm=s=>kataToHira(romaToKana(s)).replace(/[\s、。，．,.!?！？・〜~「」]/g,'');

const CONF=['さちきそ','はほけま','ねれわぬめ','あおめぬ','るろ','こいりに','うらつ','たなに','かが','はばぱ','ふぶぷ','ほぼぽ','っつ','ゃや','ゅゆ','ょよ',
 'シツミ','ソンリ','ウワフラ','クケタ','コユロ','ナメヌ','ルレ','ホオ','ビピヒ','ッツ','ャヤ','ュユ','ョヨ','ーー','ドトト','ズス','ジシ','ガカ','バパハ','ベペヘ'];
const CMAP={};CONF.forEach(g=>[...g].forEach(c=>{CMAP[c]=CMAP[c]||new Set();[...g].forEach(o=>{if(o!==c)CMAP[c].add(o);});}));
const HIRA='あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだでどばびぶべぼぱぴぷぺぽ';
const KATA='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワンガギグゲゴザジズゼゾダデドバビブベボパピプペポ';
function distractChars(chars,n=3){
  const set=new Set(chars),out=[];
  shuffle(chars).forEach(c=>{if(CMAP[c])shuffle([...CMAP[c]]).forEach(o=>{if(!set.has(o)&&!out.includes(o)&&out.length<n)out.push(o);});});
  const pool=/[\u30a0-\u30ff]/.test(chars.join(''))?KATA:HIRA;
  while(out.length<n){const o=pool[Math.floor(Math.random()*pool.length)];if(!set.has(o)&&!out.includes(o))out.push(o);}
  return out;}
const PARTS=['は','が','を','に','で','の','も','へ','と','から'];
function distractBlocks(blocks){return shuffle(PARTS.filter(p=>!blocks.includes(p))).slice(0,blocks.length>=5?2:1);}

const PADS=new Set();
function makePad(text,{guide=true,label=''}={}){
  const w=h('div','pad');
  w.innerHTML=`${label?`<div class="pad-label">${label}</div>`:''}<div class="pad-tools">
    <button class="tb ${guide?'on':''}" data-a="guide">👁 밑그림</button>

    <button class="tb" data-a="eraser">🧽 지우개</button>
    <button class="tb" data-a="blank">📝 백지 테스트</button>
    <button class="tb" data-a="clear">🗑 지우기</button></div>
    <div class="stage"><canvas class="bg"></canvas><canvas class="ink"></canvas></div>`;
  const stage=$('.stage',w),bg=$('.bg',w),ink=$('.ink',w);
  const chars=[...text.replace(/\s/g,'')];
  let cell=60,W=0,H=0,cols=1,x0=0,dpr=1,eraser=false,drawing=false,last=null,pid=null;
  const bctx=bg.getContext('2d'),ictx=ink.getContext('2d');
  function layout(force){
    const width=Math.floor(stage.clientWidth);if(!width)return;
    if(!force&&Math.abs(width-W)<30)return;
    dpr=Math.min(3,window.devicePixelRatio||1);W=width;
    cell=W<380?50:W<560?58:W<760?66:74;
    cols=Math.max(1,Math.floor((W-8)/cell));const rows=Math.max(1,Math.ceil(chars.length/cols));
    H=rows*cell+8;x0=Math.floor((W-cols*cell)/2);
    [bg,ink].forEach(c=>{c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';});
    stage.style.height=H+'px';
    bctx.setTransform(dpr,0,0,dpr,0,0);ictx.setTransform(dpr,0,0,dpr,0,0);
    drawBg();
  }
  function drawBg(){
    bctx.clearRect(0,0,W,H);const rows=Math.max(1,Math.ceil(chars.length/cols));
    const grid=cssv('--grid'),gd=cssv('--guide');
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const x=x0+c*cell,y=4+r*cell,i=r*cols+c;
      bctx.setLineDash([]);bctx.strokeStyle=grid;bctx.lineWidth=1.4;bctx.strokeRect(x+.5,y+.5,cell,cell);
      bctx.setLineDash([4,4]);bctx.lineWidth=1;bctx.beginPath();
      bctx.moveTo(x+cell/2,y+3);bctx.lineTo(x+cell/2,y+cell-3);bctx.moveTo(x+3,y+cell/2);bctx.lineTo(x+cell-3,y+cell/2);bctx.stroke();
      if(guide&&i<chars.length){bctx.setLineDash([]);bctx.fillStyle=gd;
        bctx.font=`${Math.round(cell*.74)}px 'Klee One','Hiragino Mincho ProN','Yu Mincho',serif`;
        bctx.textAlign='center';bctx.textBaseline='middle';bctx.fillText(chars[i],x+cell/2,y+cell/2+cell*.03);}
    }
    bctx.setLineDash([]);
  }
  const pt=e=>{const r=ink.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,p:e.pointerType==='pen'?(e.pressure||.5):.5};};
  function seg(a,b){
    ictx.globalCompositeOperation=eraser?'destination-out':'source-over';
    ictx.strokeStyle=cssv('--ink');ictx.lineCap='round';ictx.lineJoin='round';
    ictx.lineWidth=eraser?cell*.42:Math.max(1.8,cell*.065*(.55+b.p));
    ictx.beginPath();ictx.moveTo(a.x,a.y);ictx.lineTo(b.x,b.y);ictx.stroke();
  }
  ink.addEventListener('pointerdown',e=>{
    if(S.penOnly&&e.pointerType==='touch')return;   // 손바닥 무시(펜 전용)
    if(drawing)return;e.preventDefault();
    try{ink.setPointerCapture(e.pointerId);}catch(_){}
    drawing=true;pid=e.pointerId;last=pt(e);seg(last,{...last,x:last.x+.01});
  });
  ink.addEventListener('pointermove',e=>{
    if(!drawing||e.pointerId!==pid)return;e.preventDefault();
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    (evs.length?evs:[e]).forEach(ev=>{const p=pt(ev);seg(last,p);last=p;});
  });
  const end=e=>{if(e.pointerId===pid){drawing=false;pid=null;}};
  ink.addEventListener('pointerup',end);ink.addEventListener('pointercancel',end);
  ink.addEventListener('touchstart',e=>{if(!S.penOnly)e.preventDefault();},{passive:false});
  ink.addEventListener('contextmenu',e=>e.preventDefault());
  $('.pad-tools',w).addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
    const tb=k=>$(`[data-a=${k}]`,w);
    if(a==='guide'){guide=!guide;b.classList.toggle('on',guide);drawBg();}
    if(a==='pen'){eraser=false;b.classList.add('on');tb('eraser').classList.remove('on');}
    if(a==='eraser'){eraser=true;b.classList.add('on');tb('pen').classList.remove('on');}
    if(a==='clear'){ictx.clearRect(0,0,W,H);}
    if(a==='blank'){guide=false;tb('guide').classList.remove('on');ictx.clearRect(0,0,W,H);drawBg();
      toast('📝 백지 테스트! 보지 않고 써 본 뒤 <b>👁 밑그림</b>을 켜서 겹쳐 비교하세요.',3200);}
  });
  w._init=()=>layout(true);w._resize=()=>layout(false);
  PADS.add(w);
  return w;
}

function makeTiles(word,onOk){
  const box=h('div','tiles');const chars=[...word.replace(/\s/g,'')];
  let pool,chosen;
  function reset(){
    const all=[...chars.map((c,i)=>({c,id:'a'+i})),...distractChars(chars,Math.min(4,Math.max(2,Math.ceil(chars.length/2)))).map((c,i)=>({c,id:'x'+i}))];
    do{pool=shuffle(all);}while(chars.length>1&&pool.filter(p=>p.id[0]==='a').map(p=>p.c).join('')===word&&pool.length>2&&Math.random()<.9);
    chosen=[];draw();
  }
  function draw(state){
    box.innerHTML=`<div class="slots ${state||''}">${chars.map((_,i)=>`<span class="slot ${chosen[i]?'fill':''}" data-i="${i}">${chosen[i]?chosen[i].c:''}</span>`).join('')}</div>
      <div class="pool">${pool.map(p=>`<button class="tile jp" data-id="${p.id}" ${chosen.includes(p)?'disabled':''}>${p.c}</button>`).join('')}</div>
      <div class="row-btns"><button class="sbtn" data-a="reset">↺ 다시 섞기</button><button class="sbtn" data-a="hint">💡 힌트</button><button class="sbtn" data-a="say">🔊 듣기</button></div>`;
  }
  box.addEventListener('click',e=>{
    const t=e.target.closest('.tile'),s=e.target.closest('.slot'),b=e.target.closest('.sbtn');
    if(t&&!t.disabled&&chosen.length<chars.length){chosen.push(pool.find(p=>p.id===t.dataset.id));
      if(chosen.length===chars.length){const ok=chosen.map(c=>c.c).join('')===chars.join('');
        draw(ok?'ok':'bad');if(ok){speak(word);toast('⭕ 정답! 철자 완성 🎉');onOk&&onOk();}else{toast('❌ 다시 확인해 보세요. 비슷한 글자에 주의!');setTimeout(()=>{chosen=[];draw();},900);}}
      else draw();}
    else if(s&&s.classList.contains('fill')){chosen.splice(+s.dataset.i,1);draw();}
    else if(b){const a=b.dataset.a;if(a==='reset')reset();if(a==='say')speak(word);
      if(a==='hint'){const i=chosen.findIndex((c,k)=>c.c!==chars[k]);const n=i<0?chosen.length:i;toast(`💡 ${n+1}번째 글자는 <b class="jp">${chars[n]}</b>`);}}
  });
  reset();return box;
}

    if(ok)speak(target);};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)check();});
  box.addEventListener('click',e=>{const b=e.target.closest('.sbtn');if(!b)return;
    if(b.dataset.a==='chk')check();if(b.dataset.a==='say')speak(target);
    if(b.dataset.a==='ans'){res.className='ty-res';res.innerHTML=`정답: <span class="jp">${target}</span>`;}});
  return box;
}

/* ====================================================
   Step 3: 문장 조립 퀴즈
   ==================================================== */
function makeQuiz(day,dn){
  const box=h('div','quiz');const items=day.quiz;let idx=0;const solved=items.map(()=>false);
  function render(){
    const it=items[idx];const dis=distractBlocks(it.blocks);
    let pool;const all=[...it.blocks,...dis].map((t,i)=>({t,id:i}));
    let tries=0;do{pool=shuffle(all);tries++;}while(tries<20&&pool.map(p=>p.t).join('')===it.blocks.join(''));
    let chosen=[],done=solved[idx];
    box.innerHTML=`<div class="q-head"><span>문제 ${idx+1} / ${items.length}</span><span class="q-dots">${items.map((_,i)=>`<i class="${solved[i]?'ok':''} ${i===idx?'cur':''}"></i>`).join('')}</span></div>
      <div class="q-prompt">🇰🇷 ${it.mean}</div>
      <div class="q-ans"></div><div class="q-pool"></div>
      <div class="row-btns"><button class="sbtn good" data-a="chk">✅ 정답 확인</button><button class="sbtn" data-a="reset">↺ 초기화</button><button class="sbtn" data-a="hint">💡 첫 블록</button><button class="sbtn" data-a="say">🔊 힌트 듣기</button></div>
      <div class="q-fb"></div><div class="q-extra"></div>`;
    const ans=$('.q-ans',box),pl=$('.q-pool',box),fb=$('.q-fb',box),ex=$('.q-extra',box);
    function draw(){
      ans.innerHTML=chosen.length?chosen.map((p,i)=>`<button class="qb jp" data-i="${i}">${p.t}</button>`).join(''):'<span class="ph">아래 블록을 순서대로 터치하세요</span>';
      pl.innerHTML=pool.map(p=>`<button class="qb jp ${chosen.includes(p)?'used':''}" data-id="${p.id}">${p.t}</button>`).join('');
    }
    function success(){
      solved[idx]=true;ans.classList.add('ok');fb.className='q-fb ok';
      fb.innerHTML=`⭕ 정답! <span class="jp">${it.blocks.join(' ')}</span><br><small>${it.read}</small>`;speak(it.blocks.join(''));
      if(S.mode==='pencil'){ex.innerHTML='';mountPad(ex,makePad(it.blocks.join(''),{guide:false,label:'✏️ 백지 쓰기 테스트 — 방금 문장을 보지 않고 써 보세요 (다 쓰면 👁 밑그림으로 비교)'}));}
      const nx=h('div','row-btns');
      if(solved.every(Boolean))nx.innerHTML=`<button class="bigbtn" data-a="stamp">🌸 출석 도장 받기</button>`;
      else nx.innerHTML=`<button class="bigbtn" data-a="next">다음 문제 ➜</button>`;
      ex.prepend(nx);
      $$('.q-dots i',box)[idx].classList.add('ok');
    }
    draw();if(done){const used=new Set();chosen=it.blocks.map(t=>{const p=pool.find(p=>p.t===t&&!used.has(p));used.add(p);return p;});draw();success();}
    box.onclick=e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.classList.contains('qb')&&!solved[idx]){
        if(b.closest('.q-ans')){chosen.splice(+b.dataset.i,1);}
        else{const p=pool.find(p=>p.id==b.dataset.id);if(!chosen.includes(p))chosen.push(p);}
        ans.classList.remove('bad');draw();return;}
      const a=b.dataset.a;
      if(a==='chk'&&!solved[idx]){
        if(chosen.map(p=>p.t).join('')===it.blocks.join(''))success();
        else{ans.classList.remove('bad');void ans.offsetWidth;ans.classList.add('bad');fb.className='q-fb bad';
          fb.innerHTML=chosen.length<it.blocks.length?'🤏 블록이 부족해요. 끝까지 조립해 보세요!':'❌ 어순이나 조사를 다시 확인해 보세요. (함정 조사가 섞여 있어요!)';}}
      if(a==='reset'&&!solved[idx]){chosen=[];fb.innerHTML='';draw();}
      if(a==='hint')toast(`💡 첫 블록은 <b class="jp">${it.blocks[0]}</b>`);
      if(a==='say')speak(it.blocks.join(''));
      if(a==='next'){idx=solved.findIndex(s=>!s);if(idx<0)idx=0;render();}
      if(a==='stamp')stamp(dn);
    };
  }
  render();return box;
}

/* ---------- 출석 도장 ---------- */
function stamp(dn){
  const first=!S.done[dn];if(first){S.done[dn]=fmt(new Date());save();}
  const added=enrollDay(dn);
  const o=$('#stampOv');
  o.innerHTML=`<div class="stamp-box"><div class="stamp"><span>合格</span><small>DAY ${dn}</small></div>
    <h3>${first?'오늘의 출석 도장 쾅! 🌸':'이미 도장을 받은 날이에요 🌸'}</h3><p>${S.done[dn]} 완료 · 전체 ${Object.keys(S.done).length}/56일</p>${added?`<p class="srs-add">🧠 카드 <b>${added}장</b>이 장기기억 복습함에 들어갔어요 — 내일부터 복습!</p>`:''}
    <div class="row-btns">${dn<56?`<button class="bigbtn" data-go="${dn+1}">다음 Day ➜</button>`:''}<button class="sbtn" data-close>닫기</button></div></div>`;

const KCONF=new Set([...'さちきそはほけねれわぬめるろこいりシツソンクケタメナルレユヨコロ']);
function kanaCells(set,script,yoon){
  const rows=set[script].split(' '),ro=set.roma.split('|'),ko=set.kor.split('|');
  const out=[];
  rows.forEach((r,ri)=>{
    const chars=yoon?r.match(/.[ゃゅょャュョ]/g):[...r];
    const rr=ro[ri].split(' '),kk=ko[ri].split(' ');
    chars.forEach((c,ci)=>out.push(c==='_'?null:{c,r:rr[ci],k:kk[ci]}));
  });return out;}
function kanaPanel(set,script,yoon){
  const isH=script==='hira';
  const cells=kanaCells(set,script,yoon);
  return `<div class="kpanel"><div class="ktitle">${isH?'<span class="emo">🍓</span>':''}<div class="tt"><b>${isH?'ひらがな':'カタカナ'}</b><small>${isH?'히라가나':'가타카나'}</small></div>${isH?'':'<span class="emo">🍙</span>'}</div>
   <div class="kgrid ${yoon?'c3':''}">${cells.map(x=>x?`<button class="kc ${S.kConf&&!yoon&&KCONF.has(x.c)?'conf':''}" data-k="${x.c}"><span class="kj">${x.c}</span><span class="kr">${x.k} <i>(${x.r})</i></span></button>`:'<div class="kc empty"></div>').join('')}</div></div>`;}

   🎯 50음도 연습: 맞추기 퀴즈 + ✏️ 따라 쓰기

S.kStat=S.kStat||{};            // {글자:{o:맞힘,n:틀림,w:쓰기점수최고}}
let kMode='table';               // table | quiz | write
const KGROUPS=['さちき','はほまけ','ねれわ','ぬめあ','るろ','いりこ','あおめ','うらつ','しつ','たなに','くへ','そろ','シツ','ソンリ','クケタ','ナメノ','ユヨコロ','ルレ','ウワフヲ','チテ','アマ','セヤ','ホオ',
 'ばぱ','びぴ','ぶぷ','べぺ','ぼぽ','バパ','ビピ','ブプ','ベペ','ボポ','がか','ざさ','だた','ガカ','ザサ','ダタ'];
const KSET=()=>kTab==='basic'?K50:kTab==='daku'?KD:KY;
function kPool(script){
  const set=KSET(),y=kTab==='yoon',sc=script?[script]:(kView==='both'?['hira','kata']:[kView]);
  return sc.flatMap(s=>kanaCells(set,s,y).filter(Boolean).map(x=>({...x,s})));
}
const kLabel=x=>`${x.k} (${x.r})`;
const kStatOf=c=>S.kStat[c]||(S.kStat[c]={o:0,n:0,w:0});
const kWeak=c=>{const t=S.kStat[c];return t&&t.n>0&&t.n>=t.o/2;};
const kGood=c=>{const t=S.kStat[c];return t&&t.o>=3&&t.n*3<=t.o;};

/* ---------- 퀴즈 ---------- */
let KQ=null, kqType='mix', kqWeak=false;
const KQT=[['mix','🔀 섞어서'],['k2r','글자 → 발음'],['r2k','발음 → 글자'],['ear','🔊 듣고 고르기']];
function kDistract(ans,pool,type,n=3){
  const same=pool.filter(x=>x.s===ans.s&&x.c!==ans.c&&x.k!==ans.k&&x.r!==ans.r&&!(type==='ear'&&'をヲ'.includes(x.c)));
  const g=KGROUPS.filter(g=>[...ans.c].length===1&&g.includes(ans.c)).join('');
  const near=shuffle(same.filter(x=>g.includes(x.c))).slice(0,2);
  const rest=shuffle(same.filter(x=>!near.includes(x)));
  return [...near,...rest].slice(0,n);
}
function kqStart(list){
  let pool=kPool();
  const qpool=pool.filter(x=>!'ぢづヂヅ'.includes(x.c));
  let src=list?qpool.filter(x=>list.includes(x.c)):qpool;
  if(!list&&kqWeak){const w=src.filter(x=>kWeak(x.c));if(w.length>=3)src=w;else toast('약한 글자가 아직 적어서 전체에서 출제해요');}
  if(!src.length){toast('출제할 글자가 없어요');return;}
  let qs=shuffle(src);while(qs.length<10&&!list)qs=qs.concat(shuffle(src));qs=qs.slice(0,list?Math.min(20,qs.length):10);
  KQ={pool,qs:qs.map(a=>{let t=kqType==='mix'?['k2r','r2k','ear'][Math.floor(Math.random()*3)]:kqType;
      if(t==='ear'&&'をヲ'.includes(a.c))t='k2r';
      return{a,t,opts:shuffle([a,...kDistract(a,pool,t)])};}),i:0,ok:0,wrong:[],answered:-1};
  kMode='quiz';renderKana();
}
function kqHTML(){
  if(!KQ){ // 시작 화면
    const pool=kPool(),wk=pool.filter(x=>kWeak(x.c)).length;
    return `<div class="kq-start">
      <div class="kq-emo">🎯</div><h4>글자 맞추기 퀴즈 (10문제)</h4>
      <p>범위: <b>${{basic:'기본(청음)',daku:'탁음·반탁음',yoon:'요음'}[kTab]}</b> · <b>${{both:'ひらがな+カタカナ',hira:'ひらがな',kata:'カタカナ'}[kView]}</b> <small>(위 탭·버튼으로 바꿀 수 있어요)</small></p>
      <div class="kq-types">${KQT.map(([k,l])=>`<button class="pill ${kqType===k?'on':''}" data-kqt="${k}">${l}</button>`).join('')}</div>
      <label class="kq-chk"><input type="checkbox" data-kqw ${kqWeak?'checked':''}> 🔥 약한 글자 위주로 (${wk}자)</label>
      <div class="row-btns"><button class="bigbtn" data-kqgo>▶ 시작</button></div>
      <p class="kq-tip">헷갈리는 글자(さ/ち, シ/ツ …)가 보기로 함께 나와요. 키보드 1~4로도 고를 수 있어요.</p></div>`;
  }
  if(KQ.i>=KQ.qs.length){
    const n=KQ.qs.length,sc=Math.round(KQ.ok/n*100),wr=[...new Set(KQ.wrong)];
    return `<div class="kq-start"><div class="kq-emo">${sc>=90?'🏆':sc>=60?'💪':'🌱'}</div><h4>${KQ.ok} / ${n} 정답 (${sc}%)</h4>
      ${wr.length?`<p>틀린 글자 — 터치하면 🔊</p><div class="kq-wrong">${wr.map(c=>{const x=KQ.pool.find(p=>p.c===c);return`<button class="kq-wc" data-ksay="${c}"><b>${c}</b><small>${kLabel(x)}</small></button>`;}).join('')}</div>
       <div class="row-btns"><button class="bigbtn" data-kqwrite>✏️ 틀린 글자 따라 쓰기</button><button class="sbtn" data-kqre>🔁 틀린 글자만 다시</button></div>`:'<p>완벽해요! 모든 글자를 맞혔어요 🎉</p>'}
      <div class="row-btns"><button class="sbtn" data-kqgo>🎯 새 10문제</button><button class="sbtn" data-kqback>설정으로</button></div></div>`;
  }
  const q=KQ.qs[KQ.i],a=q.a,done=KQ.answered>=0;
  const prompt=q.t==='k2r'?`<div class="kq-hint">이 글자의 발음은?</div><div class="kq-big jp">${a.c}</div>`
    :q.t==='r2k'?`<div class="kq-hint">이 발음의 ${a.s==='hira'?'히라가나':'가타카나'}는?</div><div class="kq-big">${a.k}<small> (${a.r})</small></div>`
    :`<div class="kq-hint">잘 듣고 ${a.s==='hira'?'히라가나':'가타카나'}를 고르세요</div><button class="kq-ear" data-kqsay>🔊</button>`;
  return `<div class="kq">
    <div class="rv-prog"><div class="bar"><i style="width:${KQ.i/KQ.qs.length*100}%"></i></div><span>${KQ.i+1} / ${KQ.qs.length} · ✅ ${KQ.ok}</span><button class="sbtn" data-kqback>그만</button></div>
    <div class="kq-card">${prompt}</div>
    <div class="kq-opts ${q.t==='k2r'?'txt':''}">${q.opts.map((o,i)=>{
      let cls='';if(done){if(o.c===a.c)cls='ok';else if(i===KQ.answered)cls='bad';}
      return `<button class="kq-o ${cls}" data-kqa="${i}" ${done?'disabled':''}><em>${i+1}</em>${q.t==='k2r'?kLabel(o):`<span class="jp">${o.c}</span>`}${done&&q.t!=='k2r'?`<small>${kLabel(o)}</small>`:''}</button>`;}).join('')}</div>
    ${done?`<div class="kq-fb ${q.opts[KQ.answered].c===a.c?'ok':'bad'}">${q.opts[KQ.answered].c===a.c?'⭕ 정답!':'❌ 아쉬워요'} <b class="jp">${a.c}</b> = ${kLabel(a)}
      ${q.opts[KQ.answered].c!==a.c?`<button class="sbtn" data-kqw1="${a.c}">✏️ 써 보기</button>`:''}<button class="bigbtn" data-kqnext>다음 →</button></div>`:''}
  </div>`;
}
function kqAnswer(i){
  if(!KQ||KQ.answered>=0||KQ.i>=KQ.qs.length)return;
  const q=KQ.qs[KQ.i],ok=q.opts[i].c===q.a.c,st=kStatOf(q.a.c);
  KQ.answered=i;if(ok){KQ.ok++;st.o++;}else{st.n++;KQ.wrong.push(q.a.c);}
  save();speak(q.a.c);renderKana();
  if(ok)KQ._t=setTimeout(()=>{if(KQ&&KQ.answered===i)kqNext();},900);
}
function kqNext(){if(!KQ)return;clearTimeout(KQ._t);KQ.i++;KQ.answered=-1;renderKana();
  const q=KQ.qs[KQ.i];if(q&&q.t==='ear')setTimeout(()=>speak(q.a.c),250);}

/* ---------- 따라 쓰기 ---------- */
let KW={script:null,list:null,i:0,blank:false,scores:null};
function kwList(){
  const sc=KW.script||(kView==='kata'?'kata':'hira');KW.script=sc;
  const all=kPool(sc);
  if(KW.list){const l=all.filter(x=>KW.list.includes(x.c));if(l.length)return l;}
  return all;
}
function kwHTML(){
  const list=kwList();if(KW.i>=list.length)KW.i=0;const x=list[KW.i],st=S.kStat[x.c];
  return `<div class="kw">
   <div class="kw-bar">
     <div class="seg" style="padding:2px">${[['hira','ひらがな'],['kata','カタカナ']].map(([k,l])=>`<button class="${KW.script===k?'on':''}" data-kws="${k}">${l}</button>`).join('')}</div>
     ${KW.list?`<button class="pill on" data-kwall>🔥 틀린 글자 ${list.length}자 · 전체 보기</button>`:''}
     <button class="pill ${KW.blank?'on':''}" data-kwblank>📝 백지 테스트 ${KW.blank?'ON':'OFF'}</button>
   </div>
   <div class="kw-strip">${list.map((y,i)=>`<button class="kw-ch ${i===KW.i?'on':''} ${kGood(y.c)?'good':''} ${kWeak(y.c)?'weak':''}" data-kwi="${i}">${y.c}</button>`).join('')}</div>
   <div class="kw-head">
     <button class="sbtn" data-kwmove="-1">◀</button>
     <div class="kw-cur">${KW.blank?`<span class="kw-q">${x.k} <small>(${x.r})</small></span><small>보지 않고 ${x.s==='hira'?'히라가나':'가타카나'}로 써 보세요</small>`
       :`<span class="jp kw-big">${x.c}</span><span>${x.k} <small>(${x.r})</small></span>`}</div>
     <button class="sbtn" data-ksay="${x.c}">🔊</button>
     <button class="sbtn" data-kwmove="1">▶</button>
   </div>
   <div class="kw-pad" id="kwPad"></div>
   <div class="kw-tools">
     <button class="tb" data-kwa="clear">🗑 지우기</button><button class="tb" data-kwa="eraser">🧽 지우개</button>
     <button class="bigbtn" data-kwa="check">✅ 채점</button><button class="tb" data-kwa="rand">🎲 랜덤</button>
   </div>
   <div class="kw-res" id="kwRes">${st&&st.w?`이 글자 최고 점수 <b>${st.w}점</b>`:''}</div>
   <div class="knote">✏️ <b>1칸</b>: 진한 밑그림 따라 쓰기 → <b>2칸</b>: 흐린 밑그림 → <b>3칸</b>: 빈칸에 혼자 쓰기. <b>채점</b>을 누르면 밑그림과 얼마나 겹치는지 점수로 보여 줘요(참고용 자동 채점이라 획순·삐침까지는 보지 못해요).
   ${S.mode==='pencil'?(S.penOnly?' · 🖊 펜 전용 ON (손바닥 무시)':''):' · 👆 손가락으로도 쓸 수 있어요'}</div>
  </div>`;
}
let kwPad=null;
function kwMount(){
  const box=$('#kwPad');if(!box)return;const x=kwList()[KW.i];
  box.innerHTML='<canvas class="bg"></canvas><canvas class="ink"></canvas>';
  const bg=$('.bg',box),ink=$('.ink',box),bc=bg.getContext('2d'),ic=ink.getContext('2d');
  const N=3;let cell=100,x0=0,W=0,H=0,dpr=1,er=false,drawing=false,last=null,pid=null,shown=new Set();
  const font=c=>`${Math.round(c*.78)}px 'Klee One','Hiragino Mincho ProN','Yu Mincho',serif`;
  const yoon=[...x.c].length>1;
  function layout(){
    W=Math.floor(box.clientWidth);if(!W)return;dpr=Math.min(3,devicePixelRatio||1);
    cell=Math.min(210,Math.floor((W-8)/N));H=cell+8;x0=Math.floor((W-cell*N)/2);
    [bg,ink].forEach(c=>{c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';});
    box.style.height=H+'px';bc.setTransform(dpr,0,0,dpr,0,0);ic.setTransform(dpr,0,0,dpr,0,0);drawBg();
  }
  function glyph(ctx,cx,cy,c,size){ctx.font=font(size*(yoon?.62:1));ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(c,cx,cy+size*.03);}
  function drawBg(){
    bc.clearRect(0,0,W,H);const grid=cssv('--grid');
    for(let k=0;k<N;k++){const X=x0+k*cell,Y=4;
      bc.setLineDash([]);bc.strokeStyle=grid;bc.lineWidth=1.6;bc.strokeRect(X+.5,Y+.5,cell,cell);
      bc.setLineDash([5,5]);bc.lineWidth=1;bc.beginPath();
      bc.moveTo(X+cell/2,Y+4);bc.lineTo(X+cell/2,Y+cell-4);bc.moveTo(X+4,Y+cell/2);bc.lineTo(X+cell-4,Y+cell/2);
      bc.moveTo(X+4,Y+4);bc.lineTo(X+cell-4,Y+cell-4);bc.moveTo(X+cell-4,Y+4);bc.lineTo(X+4,Y+cell-4);bc.globalAlpha=.45;bc.stroke();bc.globalAlpha=1;
      bc.setLineDash([]);
      const a=shown.has(k)?.22:KW.blank?0:k===0?.30:k===1?.12:0;
      if(a){bc.fillStyle=document.documentElement.dataset.theme==='dark'?`rgba(255,255,255,${a})`:`rgba(30,30,30,${a})`;glyph(bc,X+cell/2,Y+cell/2,x.c,cell);}
    }
  }
  const pt=e=>{const r=ink.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,p:e.pointerType==='pen'?(e.pressure||.5):.5};};
  function seg(a,b){ic.globalCompositeOperation=er?'destination-out':'source-over';ic.strokeStyle=cssv('--ink');ic.lineCap='round';ic.lineJoin='round';
    ic.lineWidth=er?cell*.16:Math.max(3,cell*.052*(.6+b.p));ic.beginPath();ic.moveTo(a.x,a.y);ic.lineTo(b.x,b.y);ic.stroke();}
  ink.addEventListener('pointerdown',e=>{if(S.mode==='pencil'&&S.penOnly&&e.pointerType==='touch')return;if(drawing)return;e.preventDefault();
    try{ink.setPointerCapture(e.pointerId);}catch(_){}drawing=true;pid=e.pointerId;last=pt(e);seg(last,{...last,x:last.x+.01});});
  ink.addEventListener('pointermove',e=>{if(!drawing||e.pointerId!==pid)return;e.preventDefault();
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];(evs.length?evs:[e]).forEach(ev=>{const p=pt(ev);seg(last,p);last=p;});});
  const end=e=>{if(e.pointerId===pid){drawing=false;pid=null;}};
  ink.addEventListener('pointerup',end);ink.addEventListener('pointercancel',end);
  ink.addEventListener('touchstart',e=>{if(!(S.mode==='pencil'&&S.penOnly))e.preventDefault();},{passive:false});
  /* 자동 채점: 글자 모양(밑그림)과 손글씨의 겹침 정도 */
  function score(k){
    const G=64,X=x0+k*cell,Y=4;
    const ic2=document.createElement('canvas');ic2.width=ic2.height=G;const c2=ic2.getContext('2d');
    c2.drawImage(ink,X*dpr,Y*dpr,cell*dpr,cell*dpr,0,0,G,G);
    const I=c2.getImageData(0,0,G,G).data;
    c2.clearRect(0,0,G,G);c2.fillStyle='#000';glyph(c2,G/2,G/2,x.c,G);
    const T=c2.getImageData(0,0,G,G).data;
    const ia=new Uint8Array(G*G),ta=new Uint8Array(G*G);let ni=0,nt=0;
    for(let p=0;p<G*G;p++){if(I[p*4+3]>40){ia[p]=1;ni++;}if(T[p*4+3]>90){ta[p]=1;nt++;}}
    if(ni<12)return null;
    const dil=(a,r)=>{const o=new Uint8Array(G*G);for(let y=0;y<G;y++)for(let x=0;x<G;x++)if(a[y*G+x])
      for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const yy=y+dy,xx=x+dx;if(yy>=0&&yy<G&&xx>=0&&xx<G)o[yy*G+xx]=1;}return o;};
    const id=dil(ia,3),td=dil(ta,4);let hitT=0,hitI=0;
    for(let p=0;p<G*G;p++){if(ta[p]&&id[p])hitT++;if(ia[p]&&td[p])hitI++;}
    const R=hitT/Math.max(1,nt),P=hitI/ni,F=P+R?2*P*R/(P+R):0;
    return Math.round(Math.min(100,Math.max(0,(F-.2)/.65*100)));
  }
  kwPad={
    clear(){ic.clearRect(0,0,W,H);shown.clear();drawBg();$('#kwRes').innerHTML='';},
    eraser(b){er=!er;b.classList.toggle('on',er);},
    check(){
      const res=[...Array(N)].map((_,k)=>score(k));
      if(res.every(v=>v===null)){toast('먼저 칸에 글자를 써 보세요 ✏️');return;}
      res.forEach((v,k)=>{if(v!==null)shown.add(k);});drawBg();   // 비교용 밑그림 겹쳐 보기
      const best=Math.max(...res.filter(v=>v!==null)),st=kStatOf(x.c);if(best>st.w)st.w=best;save();
      const lab=v=>v===null?'<span class="sc0">—</span>':`<span class="${v>=75?'sc3':v>=55?'sc2':'sc1'}">${v}점</span>`;
      $('#kwRes').innerHTML=`${res.map((v,k)=>`${k+1}칸 ${lab(v)}`).join(' · ')}<br>${best>=75?'🌸 훌륭해요! 밑그림과 거의 겹쳐요':best>=55?'👍 좋아요! 회색 밑그림과 비교해 보세요':'🌱 회색 밑그림과 비교해서 한 번 더!'}`;
      speak(x.c);
      $$('.kw-ch')[KW.i]?.classList.toggle('good',kGood(x.c)||best>=75);
    }};
  layout();
  if(window._kwRO)_kwRO.disconnect();const ro=window._kwRO=new ResizeObserver(()=>{const w=Math.floor(box.clientWidth);if(w&&Math.abs(w-W)>20){layout();ic.clearRect(0,0,W,H);}});ro.observe(box);
}

const dnum=d=>Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/DMS);
const TODAY=()=>dnum(new Date());
const TRIPN=dnum(TRIP);
const IV=[0,1,2,4,7,12,20,35];                 // 단계별 복습 간격(일)
const STAGES=[['새 카드·다시','#9aa1ab',b=>b===0],['학습 중','#f0a020',b=>b>=1&&b<=2],['익숙해짐','#2f6fdf',b=>b>=3&&b<=4],['장기기억 🏆','#1f9d55',b=>b>=5]];
const CARD={};DATA.forEach((d,di)=>d.cards.forEach(c=>{c.day=di+1;CARD[c.id]=c;}));
S.srs=S.srs||{};S.rvLog=S.rvLog||{};
function enroll(id,due){if(CARD[id]&&!S.srs[id]){S.srs[id]={b:0,due:due??TODAY()+1,n:0,l:0,iv:0};return true;}return false;}
function enrollDay(n,due){let k=0;DATA[n-1].cards.forEach(c=>{if(enroll(c.id,due))k++;});save();return k;}
function capIv(iv){const left=TRIPN-1-TODAY();return(left>=1&&iv>left)?left:iv;}   // 출국 전날까지는 간격 압축
function preview(r,rate){
  if(rate===0)return{b:0,iv:0};
  if(rate===1)return{b:Math.max(1,r.b),iv:capIv(Math.max(1,Math.round((r.iv||1)*1.2)))};
  const b=Math.min(IV.length-1,Math.max(1,r.b+(rate===2?1:2)));return{b,iv:capIv(IV[b])};
}
function applyRate(id,rate){const r=S.srs[id],t=TODAY(),p=preview(r,rate);
  r.n++;r.last=t;if(rate===0)r.l++;r.b=p.b;r.iv=p.iv;r.due=t+p.iv;
  S.rvLog[t]=(S.rvLog[t]||0)+1;save();}
const ivLabel=iv=>iv===0?'곧 다시':iv<30?`${iv}일`:`${Math.round(iv/30)}개월`;
const dueIds=()=>{const t=TODAY();return Object.keys(S.srs).filter(id=>S.srs[id].due<=t);};
const weakIds=()=>Object.keys(S.srs).filter(id=>S.srs[id].l>=2).sort((a,b)=>S.srs[b].l-S.srs[a].l);
const longCount=()=>Object.values(S.srs).filter(r=>r.b>=5).length;
function streak(){let t=TODAY(),n=0;if(!S.rvLog[t])t--;while(S.rvLog[t]){n++;t--;}return n;}

function clozeHTML(c){
  if(c.blocks.length<2||c.key===c.sentence)return'';

  return c.blocks.map(b=>{if(!hit&&b.t===c.key){hit=true;return`<span class="cz">${'＿'.repeat(Math.min(5,[...b.t].length))}</span>`;}return b.t;}).join(' ');

     ?`<div class="rv-q">얼마나 잘 기억났나요?</div><div class="rates">${rates.map(([l,k],i)=>{const p=RV.sched?preview(r,i):null;

       <div class="rv-keys">키보드: 1 다시 · 2 어려움 · 3 알맞음 · 4 쉬움</div>`
     :`<div class="row-btns"><button class="bigbtn" data-rflip>정답 보기 (Space)</button></div>`}
  </div>`;
  if(!RV.flipped){
    if(RV.dir==='jp'){if(!RV.seen.has(id))speak(c.sentence);}
    else{const w=$('.rv-work',box);
      if(S.mode==='pencil')mountPad(w,makePad(c.key,{guide:false,label:'✏️ 보지 않고 써 보세요 → 정답 보기 후 👁 밑그림으로 비교'}));

function flip(){if(!RV||RV.flipped)return;RV.flipped=true;
  const w=$('.rv-work');const keep=w&&w.firstChild;   // 손글씨는 유지해서 비교

function rate(i){
  if(!RV||!RV.flipped)return;const id=RV.q[RV.i];

  if(RV.sched)applyRate(id,i);else{S.rvLog[TODAY()]=(S.rvLog[TODAY()]||0)+1;save();}
  if(i===0){const pos=Math.min(RV.q.length,RV.i+4);RV.q.splice(pos,0,id);}   // 3~4장 뒤에 다시

  const n=dueIds().length,b=$('#srsBadge');if(b){b.textContent=n>99?'99+':n;b.style.display=n?'':'none';}
  const bn=$('#srsBanner');if(bn)bn.innerHTML=srsBannerHTML();
  const pt=$('#progTxt');if(pt&&!pt.dataset.srs){}
}
function srsBannerHTML(){
  const n=dueIds().length,N=Object.keys(S.srs).length,L=longCount();
  if(!N)return`<div class="srs-b empty">🧠 <span>오늘 Day를 끝내고 출석 도장을 받으면, 카드가 <b>장기기억 복습함</b>에 들어가 내일부터 복습이 시작돼요.</span></div>`;
  if(n)return`<div class="srs-b due"><span>🧠 <b>오늘 복습 ${n}장</b><small>새 진도 전에 먼저 복습하면 오래 기억해요 · 약 ${Math.max(1,Math.ceil(n*8/60))}분</small></span><button class="bigbtn" data-rstart="due">복습 시작</button></div>`;
  return`<div class="srs-b ok"><span>✅ <b>오늘 복습 완료!</b><small>장기기억 ${L}장 · 복습함 ${N}장 · 연속 ${streak()}일</small></span><button class="sbtn" data-rhome>📊 현황</button></div>`;
}
$('#srsBtn').onclick=openSrs;
document.addEventListener('click',e=>{
  const st=e.target.closest('[data-rstart]');if(st&&!st.disabled){startReview(st.dataset.rstart);return;}
  if(e.target.closest('[data-rhome]')){openSrs();return;}
});
$('#srsOv').addEventListener('click',e=>{
  if(e.target.closest('[data-rclose]')||e.target.id==='srsOv'){
    if(RV&&RV.stat.total&&!confirm('복습을 중단할까요? (지금까지 평가한 카드는 저장돼요)'))return;
    RV=null;$('#srsOv').classList.remove('show');updateSrsUI();return;}
  const s=e.target.closest('[data-rsay]');if(s){speak(s.dataset.rsay);return;}
  if(e.target.closest('[data-rflip]')){flip();return;}
  const r=e.target.closest('[data-rate]');if(r)rate(+r.dataset.rate);
});
document.addEventListener('keydown',e=>{
  if(!$('#srsOv').classList.contains('show')||!RV)return;
  if(e.target.tagName==='INPUT')return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!RV.flipped)flip();}
  else if(RV.flipped&&'1234'.includes(e.key))rate(+e.key-1);
});
/* 기존 진도 이관: 이미 도장 받은 날의 카드는 오늘부터 복습 */
Object.keys(S.done).forEach(n=>enrollDay(+n,TODAY()));
Object.keys(S.mem).forEach(id=>enroll(id,TODAY()));save();

/* ---------- 시작 ---------- */
if(!S.cur)S.cur=todayNum();
updateTop();tDraw();renderNav();renderDay();updateSrsUI();

</script>
</body>
</html>
